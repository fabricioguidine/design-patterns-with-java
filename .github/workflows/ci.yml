name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }}, JDK ${{ matrix.java-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['17', '21']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Build and run tests
        shell: bash
        run: ./mvnw -B -ntp test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-jdk-${{ matrix.java-version }}
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

  coverage:
    name: Coverage (ubuntu-latest, JDK 17)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build with coverage
        shell: bash
        run: ./mvnw -B -ntp verify

      - name: Upload JaCoCo coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          fail_ci_if_error: false
          flags: unittests
          name: codecov
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco'
          if-no-files-found: ignore

  quality:
    name: Code Quality (Spotless + Checkstyle + SpotBugs)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Spotless check (formatting)
        shell: bash
        run: ./mvnw -B -ntp spotless:check

      - name: Checkstyle (informational)
        # Baseline checkstyle violations exist on the agent-generated pattern code
        # (config runs at severity=error, so any violation aborts the goal). Surface
        # findings without gating the build until the maintainer ratchets the
        # baseline and removes continue-on-error.
        continue-on-error: true
        shell: bash
        run: ./mvnw -B -ntp -Dcheckstyle.consoleOutput=true checkstyle:check

      - name: SpotBugs (informational)
        # SpotBugs findings against generated code surface as warnings, not a gate.
        continue-on-error: true
        shell: bash
        run: ./mvnw -B -ntp -DskipTests compile spotbugs:check
